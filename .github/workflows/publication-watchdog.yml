# Tells somebody when a published data layer stops publishing.
#
# Every layer degrades honestly on screen: rainfall past 72 hours is dropped
# rather than shown as news, and an aged ASDMA report is repainted in a colour
# the map uses for nothing else. A reader is never misled. Nobody is ever told
# either, and that is the gap this closes.
#
# The rainfall job stopped publishing on 2026-08-07 and was still dark on
# 2026-08-15. Nothing failed: the site kept working with the rainfall line simply
# absent from every bulletin in Assam, exactly as designed, for eight days.
#
# Deliberately not part of the CI chain. ASDMA is fetched from one Mac and is
# documented as gappy, and an upstream agency having a quiet week must not fail a
# build that changes a stylesheet. A wrong build is somebody's mistake; a quiet
# source is the world being itself, and the two want different alarms.
#
# The thresholds are the site's own. `check_publication_freshness.mjs` imports
# the page's visibility functions rather than copying their numbers, so "dark"
# here means the same thing it means on a phone in Assam.
name: Published layer watchdog

on:
  schedule:
    # 06:30 Asia/Kolkata. After the night's ASDMA runs at 20:00 and 22:00 and
    # well clear of the two-hourly Cloud Run jobs, so a single missed execution
    # is never what raises this.
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-published-layers:
    runs-on: ubuntu-latest
    steps:
      # The check reads `static/data`, which is what the site downloads, so it
      # only describes what a reader sees if this checkout is the published one.
      # A stale clone reports false darkness.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Read what the site is publishing
        id: freshness
        run: |
          node scripts/check_publication_freshness.mjs | tee freshness.txt
          node scripts/check_publication_freshness.mjs --json > freshness.json

      - name: Open or close the dark-layer issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("freshness.json", "utf8"));
            const table = fs.readFileSync("freshness.txt", "utf8");
            const dark = report.layers.filter(layer => layer.dark);
            const title = "A published data layer has gone dark";

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
            });
            const issue = issues.find(
              candidate => !candidate.pull_request && candidate.title === title,
            );

            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            if (dark.length > 0) {
              // Name the layer and say what a reader sees, because "rainfall is
              // dark" and "every bulletin in Assam has no rainfall line" are the
              // same fact and only one of them makes anybody act.
              const body = [
                `${dark.length} of ${report.layers.length} published layers are dark ` +
                  `as of ${report.as_of}.`,
                "",
                "```",
                table.trim(),
                "```",
                "",
                ...dark.map(layer =>
                  `- **${layer.name}** — a reader sees: ${layer.sees}. ` +
                  `Last published ${layer.published ?? "never"}; expected every ${layer.every}.`,
                ),
                "",
                "The site is not broken. It is working exactly as designed with these",
                "layers absent, which is why nothing else reports this.",
                "",
                `Watchdog run: ${runUrl}`,
              ].join("\n");

              if (!issue) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              } else {
                if (issue.state === "closed") {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    state: "open",
                  });
                }
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body,
                });
              }
              core.setFailed(
                `Dark: ${dark.map(layer => layer.name).join(", ")}`,
              );
            } else if (issue?.state === "open") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: every layer the site reads is publishing.\n\n${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
            }

name: Phase 0 scheduled-run watchdog

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-daily-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open or close the pipeline failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { previousDateInTimeZone } = require(
              `${process.env.GITHUB_WORKSPACE}/scripts/watchdog-date.cjs`
            );
            const ledgerPath = "data/monitor/phase0-runs.jsonl";
            const expectedRunDate = previousDateInTimeZone(
              new Date(),
              "Asia/Kolkata"
            );
            const records = fs.existsSync(ledgerPath)
              ? fs.readFileSync(ledgerPath, "utf8")
                  .split("\n")
                  .filter(Boolean)
                  .map(line => JSON.parse(line))
              : [];
            const hasScheduledSuccess = records.some(record =>
              record.status === "success" &&
              record.run_origin === "schedule" &&
              record.run_date === expectedRunDate
            );
            const title = "Phase 0 daily pipeline failed";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all"
            });
            const issue = issues.find(candidate =>
              !candidate.pull_request && candidate.title === title
            );

            if (!hasScheduledSuccess) {
              const body = [
                `No successful scheduled India-runner record was committed for ${expectedRunDate}.`,
                "",
                `Watchdog run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              ].join("\n");
              if (!issue) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body
                });
              } else if (issue.state === "closed") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: "open"
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body
                });
              }
              core.setFailed(`Missing scheduled Phase 0 success for ${expectedRunDate}`);
            } else if (issue?.state === "open") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered: scheduled India-runner evidence is present for ${expectedRunDate}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
            }
